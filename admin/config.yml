local_backend: true

backend:
  name: github
  repo: st01c/marjz-v2
  branch: main
  base_url: http://localhost:8081

publish_mode: editorial_workflow

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "entries"
    label: "All entries"
    label_singular: "Entry"
    identifier_field: "id"
    folder: "content/entries"
    extension: "md"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{fullDate}} — {{section}}"
    sortable_fields: ["commit_date", "fullDate", "year", "title"]
    fields: &entry_fields
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "Used for filenames and internal links; typically kebab-case."
      - label: "Section"
        name: "section"
        widget: "select"
        options:
          - { label: "Research", value: "research" }
          - { label: "Practice", value: "practice" }
          - { label: "Curatorial", value: "curatorial" }
          - { label: "Talks", value: "talks" }
          - { label: "Teaching", value: "teaching" }
          - { label: "Cycling", value: "cycling" }
      - label: "Type"
        name: "type"
        widget: "select"
        required: false
        # BEGIN_AUTO_TYPE_OPTIONS
        options:
          - "A/V"
          - "art criticism"
          - "artist talk"
          - "book"
          - "book chapter"
          - "CFP"
          - "commentary"
          - "conference"
          - "conference presentation"
          - "conference proceedings"
          - "curatorial"
          - "event"
          - "keynote"
          - "panel discussion"
          - "performance"
          - "podcast"
          - "public lecture"
          - "research article"
          - "screening"
          - "sound art"
          - "special issue"
          - "workshop"
        # END_AUTO_TYPE_OPTIONS
        allow_add: true
      - label: "New type"
        name: "newType"
        widget: "string"
        required: false
        hint: "Optional: enter a new type if none of the existing options apply. This will be saved and added to the list."
      - { label: "Year", name: "year", widget: "number", required: false }
      - label: "Full date (for ordering)"
        name: "fullDate"
        widget: "datetime"
        required: false
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: true
        hint: "Used for ordering; YYYY-MM-DD."
      - { label: "Featured on front page", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Pinned (homepage hero)", name: "pinned", widget: "boolean", default: false, required: false, hint: "Only one entry should be pinned; the latest pinned item becomes the homepage hero." }
      - { label: "Summary", name: "summary", widget: "text", required: false }
      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        # BEGIN_AUTO_TAG_OPTIONS
        options:
          - "abstract art"
          - "abstraction"
          - "activism"
          - "affordance theory"
          - "agency"
          - "agential assemblages"
          - "AI"
          - "AI art"
          - "algorithmic governance"
          - "anarchism"
          - "anthropocene"
          - "art market"
          - "authorship"
          - "biopower"
          - "blockchain"
          - "blockchain art"
          - "cashlessness"
          - "CCS"
          - "CFP"
          - "climate change"
          - "commons"
          - "computer art"
          - "conceptual art"
          - "copyright"
          - "COVID-19"
          - "creative agency"
          - "creative coding"
          - "Creative Commons"
          - "creative industries"
          - "critical finance"
          - "crypto art"
          - "cunning"
          - "curation"
          - "cycling"
          - "DAOs"
          - "decentralisation"
          - "deepfakes"
          - "digital art"
          - "digital commons"
          - "digital_storytelling"
          - "distributed agency"
          - "drone"
          - "educational licensing"
          - "electronic music"
          - "exhibition"
          - "financialisation"
          - "financialization"
          - "fintech"
          - "game art"
          - "game studies"
          - "gamification"
          - "GAN"
          - "global warming"
          - "hyperobjects"
          - "improvisation"
          - "intellectual property"
          - "interactive artwork"
          - "interdisciplinarity"
          - "interface"
          - "labour"
          - "law"
          - "live coding"
          - "machine vision"
          - "machinima"
          - "media art"
          - "media art history"
          - "media theory"
          - "metaverse"
          - "MoneyLab"
          - "music"
          - "mystification of AI"
          - "NFTs"
          - "non-human agency"
          - "NPC"
          - "online teaching"
          - "Open Access"
          - "open source"
          - "Orpheus Institute"
          - "ownership"
          - "perception"
          - "performance art"
          - "performances"
          - "permacomputing"
          - "photography"
          - "postgraduate research"
          - "posthumanism"
          - "publishing"
          - "radio"
          - "research network"
          - "residency"
          - "RPG"
          - "smart contracts"
          - "sound art"
          - "tactical AI"
          - "tactical media"
          - "teaching materials"
          - "token-gating"
          - "Twine"
          - "video"
          - "video art"
          - "visual indeterminacy"
          - "VR"
          - "Web3"
          - "workshop"
        # END_AUTO_TAG_OPTIONS
        allow_add: true
        required: false
      - label: "New tags"
        name: "newTags"
        widget: "string"
        required: false
        hint: "Optional: add one or more new tags, separated by commas. They will be saved and added to the list."
      - label: "Images (paths)"
        name: "images"
        widget: "list"
        summary: "{{fields.item}}"
        field: { label: "Image path", name: "item", widget: "string" }
        required: false
      - label: "Grid image (for cards only)"
        name: "gridImage"
        widget: "image"
        required: false
        hint: "Optional: image shown on listing cards. Not displayed inside the entry body."
      - label: "Video embeds"
        name: "videoEmbeds"
        widget: "list"
        required: false
        summary: "{{fields.item}}"
        field:
          label: "Embed HTML"
          name: "item"
          widget: "text"
          hint: "Paste iframe/video embed code (YouTube, Vimeo, etc.)."
        hint: "Optional: add one or more video embeds. Text in the Body field will render after these embeds."
      - label: "External link"
        name: "link"
        widget: "string"
        required: false
      - label: "Override content path"
        name: "contentPath"
        widget: "string"
        required: false
        hint: "Defaults to content/<slug>.html if left empty."
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Long-form content; will be rendered to HTML for item detail pages."
  - name: "entries-research"
    label: "All Research entries"
    label_singular: "Research entry"
    identifier_field: "id"
    folder: "content/entries"
    extension: "md"
    format: "frontmatter"
    create: false
    slug: "{{slug}}"
    summary: "{{title}} — {{fullDate}} — {{section}}"
    filter:
      field: "section"
      value: "research"
    sortable_fields: ["commit_date", "fullDate", "year", "title"]
    fields: *entry_fields
  - name: "entries-practice"
    label: "All Practice entries"
    label_singular: "Practice entry"
    identifier_field: "id"
    folder: "content/entries"
    extension: "md"
    format: "frontmatter"
    create: false
    slug: "{{slug}}"
    summary: "{{title}} — {{fullDate}} — {{section}}"
    filter:
      field: "section"
      value: "practice"
    sortable_fields: ["commit_date", "fullDate", "year", "title"]
    fields: *entry_fields
  - name: "entries-curatorial"
    label: "All Curatorial entries"
    label_singular: "Curatorial entry"
    identifier_field: "id"
    folder: "content/entries"
    extension: "md"
    format: "frontmatter"
    create: false
    slug: "{{slug}}"
    summary: "{{title}} — {{fullDate}} — {{section}}"
    filter:
      field: "section"
      value: "curatorial"
    sortable_fields: ["commit_date", "fullDate", "year", "title"]
    fields: *entry_fields
  - name: "entries-talks"
    label: "All Talks entries"
    label_singular: "Talks entry"
    identifier_field: "id"
    folder: "content/entries"
    extension: "md"
    format: "frontmatter"
    create: false
    slug: "{{slug}}"
    summary: "{{title}} — {{fullDate}} — {{section}}"
    filter:
      field: "section"
      value: "talks"
    sortable_fields: ["commit_date", "fullDate", "year", "title"]
    fields: *entry_fields
  - name: "entries-teaching"
    label: "All Teaching entries"
    label_singular: "Teaching entry"
    identifier_field: "id"
    folder: "content/entries"
    extension: "md"
    format: "frontmatter"
    create: false
    slug: "{{slug}}"
    summary: "{{title}} — {{fullDate}} — {{section}}"
    filter:
      field: "section"
      value: "teaching"
    sortable_fields: ["commit_date", "fullDate", "year", "title"]
    fields: *entry_fields
  - name: "entries-cycling"
    label: "All Cycling entries"
    label_singular: "Cycling entry"
    identifier_field: "id"
    folder: "content/entries"
    extension: "md"
    format: "frontmatter"
    create: false
    slug: "{{slug}}"
    summary: "{{title}} — {{fullDate}} — {{section}}"
    filter:
      field: "section"
      value: "cycling"
    sortable_fields: ["commit_date", "fullDate", "year", "title"]
    fields: *entry_fields
  - name: "featured-entries"
    label: "Featured entries"
    label_singular: "Featured entry"
    identifier_field: "id"
    folder: "content/entries"
    extension: "md"
    format: "frontmatter"
    create: false
    slug: "{{slug}}"
    summary: "{{title}} — {{fullDate}} — {{section}}"
    filter:
      field: "featured"
      value: true
    sortable_fields: ["commit_date", "fullDate", "year", "title"]
    fields: *entry_fields
  - name: "pages"
    label: "Pages"
    delete: false
    files:
      - name: "about"
        label: "About page"
        file: "content/about.md"
        format: "frontmatter"
        fields:
          - label: "Body"
            name: "body"
            widget: "markdown"
            hint: "Content for the About page; supports rich text/Markdown."
      - name: "cycling"
        label: "Cycling page"
        file: "content/cycling.md"
        format: "frontmatter"
        fields:
          - label: "Body"
            name: "body"
            widget: "markdown"
            hint: "Content for the Cycling page; supports rich text/Markdown."
      - name: "curatorial"
        label: "Curatorial page"
        file: "content/curatorial.md"
        format: "frontmatter"
        fields:
          - label: "Body"
            name: "body"
            widget: "markdown"
            hint: "Content for the Curatorial page; supports rich text/Markdown."
      - name: "teaching"
        label: "Teaching page"
        file: "content/teaching.md"
        format: "frontmatter"
        fields:
          - label: "Body"
            name: "body"
            widget: "markdown"
            hint: "Content for the Teaching page; supports rich text/Markdown."
