  <script src="https://unpkg.com/decap-cms@3.8.0/dist/decap-cms.js"></script>
  <script>
    // Explicit init to guarantee the inline config (with local_backend) is applied.
    if (window.CMS && window.CMS_CONFIG) {
      console.log("Initializing Decap CMS with local_backend:", window.CMS_CONFIG.local_backend);
      window.CMS.init({
        config: window.CMS_CONFIG,
        load_config_file: false, // force use of the inline config
      });
    } else {
      console.warn("CMS or CMS_CONFIG missing at init time.", { CMS: !!window.CMS, CMS_CONFIG: !!window.CMS_CONFIG });
    }

    // Keep uploaded images constrained in the CMS preview to mirror the site layout.
    document.addEventListener("DOMContentLoaded", () => {
      if (window.CMS) {
        const responsiveImageCss = `
          img,
          .responsive-image {
            max-width: 100%;
            width: 100%;
            height: auto;
            display: block;
          }

          .video-embed {
            margin: 1.25rem 0;
          }

          .video-embed iframe,
          .video-embed video {
            width: 100%;
            max-width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            border: none;
          }
        `;
        window.CMS.registerPreviewStyle(responsiveImageCss, { raw: true });
      }
    });

    // Custom preview to mirror site rendering: body text followed by video embeds; excludes gridImage.
    (function registerEntryPreview() {
      if (!window.CMS || !window.createClass || !window.h) return;
      const { createClass, h } = window;

      const EntryPreview = createClass({
        render: function () {
          const entry = this.props.entry;
          const body = this.props.widgetFor("body");
          const videoEmbeds = entry.getIn(["data", "videoEmbeds"]) || [];
          const embedList = typeof videoEmbeds.toArray === "function" ? videoEmbeds.toArray() : videoEmbeds;
          const embedNodes = Array.isArray(embedList)
            ? embedList
                .map((embed, idx) => {
                  const html = String(embed || "").trim();
                  if (!html) return null;
                  return h("div", {
                    className: "video-embed",
                    key: idx,
                    dangerouslySetInnerHTML: { __html: html },
                  });
                })
                .filter(Boolean)
            : [];

          return h("div", { className: "rich-text" }, [body, ...embedNodes]);
        },
      });

      window.CMS.registerPreviewTemplate("entries", EntryPreview);
      window.CMS.registerPreviewTemplate("featured-entries", EntryPreview);
      window.CMS.registerPreviewTemplate("entries-research", EntryPreview);
      window.CMS.registerPreviewTemplate("entries-practice", EntryPreview);
      window.CMS.registerPreviewTemplate("entries-curatorial", EntryPreview);
      window.CMS.registerPreviewTemplate("entries-teaching", EntryPreview);
      window.CMS.registerPreviewTemplate("entries-cycling", EntryPreview);
    })();
  </script>
